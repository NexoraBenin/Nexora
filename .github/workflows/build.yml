name: Construire Nexora APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extraire Nexora
        run: |
          mkdir -p nexora_project
        unzip -q Nexora_Android_V5_CompileSdk36.zip -d nexora_project

      - name: Compiler Nexora
        run: |
          cd nexora_project
          gradle :app:assembleDebug --no-daemon

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-APK
          path: nexora_project/**/build/outputs/apk/debug/*.apk
